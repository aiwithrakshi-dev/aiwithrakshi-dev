-weight="700" font-size="15">Proposal</text></g><path d="M596 70 h8" stroke="url(#brand)" stroke-width="2"/><g class="fade" style="animation-delay:0.36s"><rect x="605" y="20" width="185" height="100" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".09" filter="url(#shadow)" /><rect x="606" y="21" width="183" height="98" rx="23" fill="none" stroke="#ffffff" stroke-opacity=".06"/><rect x="621" y="36" width="44" height="44" rx="14" fill="url(#brand)"/><text x="643" y="64" text-anchor="middle" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="16" fill="#0b0d12">04</text><text x="621" y="104" class="t" font-weight="700" font-size="15">Design</text></g><path d="M791 70 h8" stroke="url(#brand)" stroke-width="2"/><g class="fade" style="animation-delay:0.48s"><rect x="800" y="20" width="185" height="100" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".09" filter="url(#shadow)" /><rect x="801" y="21" width="183" height="98" rx="23" fill="none" stroke="#ffffff" stroke-opacity=".06"/><rect x="816" y="36" width="44" height="44" rx="14" fill="url(#brand)"/><text x="838" y="64" text-anchor="middle" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="16" fill="#0b0d12">05</text><text x="816" y="104" class="t" font-weight="700" font-size="15">Build &amp; automate</text></g><path d="M986 70 h8" stroke="url(#brand)" stroke-width="2"/><g class="fade" style="animation-delay:0.6s"><rect x="995" y="20" width="185" height="100" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".09" filter="url(#shadow)" /><rect x="996" y="21" width="183" height="98" rx="23" fill="none" stroke="#ffffff" stroke-opacity=".06"/><rect x="1011" y="36" width="44" height="44" rx="14" fill="url(#brand)"/><text x="1033" y="64" text-anchor="middle" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="16" fill="#0b0d12">06</text><text x="1011" y="104" class="t" 