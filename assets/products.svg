<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Products: ContentBrisk (launching soon) and Adsynthra (coming soon)">
<defs>
