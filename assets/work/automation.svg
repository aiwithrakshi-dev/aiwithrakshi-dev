-serif" font-size="30" fill="url(#chrome)" letter-spacing="1">AI AUTOMATION</text><text x="30" y="248" class="t" font-size="16" fill-opacity=".82">Workflow automation and</text><text x="30" y="270" class="t" font-size="16" fill-opacity=".82">business systems for SMEs</text></g><rect x="6.5" y="6.5" width="387" height="287" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".10"/><rect x="7.5" y="7.5" width="385" height="285" rx="26.5" fill="none" stroke="url(#acc)" stroke-opacity=".35"/></svg>