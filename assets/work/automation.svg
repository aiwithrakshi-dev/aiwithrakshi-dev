<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="AI Automation: workflow automation and business systems for SMEs"><defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#262936"/><stop offset="1" stop-color="#0d0e14"/></linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#e2e5ee"/><stop offset=".55" stop-color="#8a91a6"/><stop offset=".68" stop-color="#eceef5"/><stop offset="1" stop-color="#9aa1b4"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#c084fc" stop-opacity=".55"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></radialGradient>
  <style>
  .t{font-family:Manrope, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#eef0f6} .m{font-family:Manrope, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#9aa0b4} .d{font-family:Anton, Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', sans-serif}
  .pulse{animation:pulse 2s ease-in-out infinite} @keyframes pulse{50%{opacity:.25}}
  .spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center} @keyframes spin{to{transform:rotate(360deg)}}
  .glow{animation:glow 3.4s ease-in-out infinite} @keyframes glow{50%{opacity:.34}}
  .sweep{animation:sweep 5s ease-in-out infinite} @keyframes sweep{0%,50%{transform:translateX(-500px)}100%{transform:translateX(900px)}}
  .bob{animation:bob 4s ease-in-out infinite} @keyframes bob{50%{transform:translateY(-5px)}}
  .wave{animation:wave 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:70% 80%}
  @keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
  .eq{animation:eq 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
  @keyframes eq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
  .blink{animation:blink 1.1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
  .fill{animation:fill 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:left}
  @keyframes fill{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.9)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
