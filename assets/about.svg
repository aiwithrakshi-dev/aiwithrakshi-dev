<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="About Rakshith: 7 products, 91 AI tools, 3 channels">
<defs>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#262936"/><stop offset="1" stop-color="#0e0f15"/></linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".38" stop-color="#dfe3ee"/><stop offset=".52" stop-color="#8a91a6"/><stop offset=".64" stop-color="#e9ecf4"/><stop offset="1" stop-color="#9aa1b4"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c084fc" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".04"/></linearGradient>
  <radialGradient id="bgglow" cx=".2" cy=".1" r=".9"><stop offset="0" stop-color="#7c3aed" stop-opacity=".35"/><stop offset=".6" stop-color="#07080c" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".55"/></filter>
  <style>
    .t{font-family:Manrope, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#eef0f6}
    .m{font-family:Manrope, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#9aa0b4}
    .d{font-family:Anton, Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', sans-serif}
    .s{font-family:'Instrument Serif', Georgia, 'Times New Roman', serif;font-style:italic}
    .pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%{opacity:1}70%{opacity:.2}100%{opacity:1}}
    .float{animation:float 6s ease-in-out infinite}
    @keyframes float{50%{transform:translateY(-8px)}}
    .rise{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(30px)}}
    .fade{animation:fade .9s ease both}
    @keyframes fade{from{opacity:0;transform:translateY(14px)}}
    .slide{animation:slide 2.4s ease-in-out infinite}
    @keyframes slide{from{transform:translateX(-120px)}to{transform:translateX(300px)}}
    .marq{animation:marq 22s linear infinite}
    @keyframes marq{to{transform:translateX(-600px)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
