  .bob{animation:bob 4s ease-in-out infinite} @keyframes bob{50%{transform:translateY(-5px)}}
  .wave{animation:wave 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:70% 80%}
  @keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
  .eq{animation:eq 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
  @keyframes eq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
  .blink{animation:blink 1.1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
  .fill{animation:fill 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:left}
  @keyframes fill{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.9)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
