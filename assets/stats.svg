" stroke-opacity=".06"/><clipPath id="st2"><rect x="604" y="20" width="280" height="130" rx="26"/></clipPath><circle class="glow" style="animation-delay:0.8s" cx="854" cy="30" r="60" fill="#f472b6" opacity=".14" clip-path="url(#st2)"/><g clip-path="url(#st2)"><rect class="sweep" style="animation-delay:0.7s" x="404" y="20" width="160" height="130" fill="url(#cardshine)"/></g><text x="628" y="98" class="d" font-size="64" fill="url(#chrome)">3.2M+</text><text x="630" y="128" class="m" font-weight="700" font-size="14">Reel plays</text></g><g class="fade" style="animation-delay:0.44999999999999996s"><rect x="896" y="20" width="280" height="130" rx="26" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".09" filter="url(#shadow)" /><rect x="897" y="21" width="278" height="128" rx="25" fill="none" stroke="#ffffff" stroke-opacity=".06"/><clipPath id="st3"><rect x="896" y="20" width="280" height="130" rx="26"/></clipPath><circle class="glow" style="animation-delay:1.2000000000000002s" cx="1146" cy="30" r="60" fill="#facc15" opacity=".14" clip-path="url(#st3)"/><g clip-path="url(#st3)"><rect class="sweep" style="animation-delay:1.0499999999999998s" x="696" y="20" width="160" height="130" fill="url(#cardshine)"/></g><text x="920" y="98" class="d" font-size="64" fill="url(#chrome)">1.6M</text><text x="922" y="128" class="m" font-weight="700" font-size="14">Top Reel</text></g></svg>