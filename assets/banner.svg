<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Rakshith — Founder of MyDesignNexus, AI with Rakshith">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07051a"/>
      <stop offset=".55" stop-color="#1a0b3d"/>
      <stop offset="1" stop-color="#3b0a52"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf3ff"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <radialGradient id="orbA" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#bff6ff"/><stop offset=".45" stop-color="#22d3ee"/><stop offset="1" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="orbB" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffd1f4"/><stop offset=".45" stop-color="#c026d3"/><stop offset="1" stop-color="#3b0764"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b0a52" stop-opacity="1"/><stop offset=".25" stop-color="#3b0a52" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="floor"><rect x="0" y="230" width="1200" height="110"/></clipPath>
    <style>
      .grid line{stroke:#d946ef;stroke-opacity:.55;stroke-width:1.4}
      .hz{animation:scroll 2.4s linear infinite}
      @keyframes scroll{from{transform:translateY(0)}to{transform:translateY(22px)}}
      .floatA{animation:floatA 6s ease-in-out infinite}
      .floatB{animation:floatB 7s ease-in-out infinite}
      @keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-14px)}}
      @keyframes floatB{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(0,12px) rotate(8deg)}}
      .ring{transform-origin:1105px 88px;animation:spin 14s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .twinkle{animation:tw 3s ease-in-out infinite}
      .twinkle:nth-child(2n){animation-delay:1s}.twinkle:nth-child(3n){animation-delay:2s}
      @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
      .flicker{animation:fl 5s infinite}
      @keyframes fl{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.55}}
      .squig{stroke-dasharray:14 10;animation:dash 3s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-48}}
      .sub{animation:pulse 4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.85}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="twinkle" cx="80" cy="40" r="1.6"/><circle class="twinkle" cx="210" cy="90" r="1.2"/>
    <circle class="twinkle" cx="330" cy="30" r="1.4"/><circle class="twinkle" cx="460" cy="70" r="1"/>
    <circle class="twinkle" cx="720" cy="36" r="1.5"/><circle class="twinkle" cx="860" cy="60" r="1.1"/>
    <circle class="twinkle" cx="980" cy="200" r="1.3"/><circle class="twinkle" cx="1140" cy="30" r="1.6"/>
    <circle class="twinkle" cx="1110" cy="170" r="1"/><circle class="twinkle" cx="150" cy="180" r="1.2"/>
    <circle class="twinkle" cx="600" cy="20" r="1.2"/><circle class="twinkle" cx="40" cy="130" r="1"/>
  </g>

  <!-- retro grid floor -->
  <g clip-path="url(#floor)">
    <rect x="0" y="230" width="1200" height="110" fill="#14062b"/>
    <g class="grid">
      <line x1="600" y1="230" x2="-600" y2="340"/><line x1="600" y1="230" x2="-300" y2="340"/>
      <line x1="600" y1="230" x2="0" y2="340"/><line x1="600" y1="230" x2="200" y2="340"/>
      <line x1="600" y1="230" x2="400" y2="340"/><line x1="600" y1="230" x2="600" y2="340"/>
      <line x1="600" y1="230" x2="800" y2="340"/><line x1="600" y1="230" x2="1000" y2="340"/>
      <line x1="600" y1="230" x2="1200" y2="340"/><line x1="600" y1="230" x2="1500" y2="340"/>
      <line x1="600" y1="230" x2="1800" y2="340"/>
      <g class="hz">
        <line x1="0" y1="214" x2="1200" y2="214"/><line x1="0" y1="236" x2="1200" y2="236"/>
        <line x1="0" y1="258" x2="1200" y2="258"/><line x1="0" y1="280" x2="1200" y2="280"/>
        <line x1="0" y1="302" x2="1200" y2="302"/><line x1="0" y1="324" x2="1200" y2="324"/>
      </g>
    </g>
    <rect x="0" y="230" width="1200" height="110" fill="url(#fade)"/>
  </g>
  <line x1="0" y1="230" x2="1200" y2="230" stroke="#f0abfc" stroke-width="2" filter="url(#glow)"/>

  <!-- left orb -->
  <g class="floatA">
    <circle cx="105" cy="250" r="52" fill="url(#orbA)" filter="url(#glow)"/>
    <ellipse cx="88" cy="233" rx="15" ry="8" fill="#fff" opacity=".35" filter="url(#soft)"/>
  </g>
  <!-- right ringed planet -->
  <g class="floatB">
    <circle cx="1105" cy="88" r="36" fill="url(#orbB)" filter="url(#glow)"/>
    <g class="ring"><ellipse cx="1105" cy="88" rx="64" ry="14" fill="none" stroke="#f5d0fe" stroke-width="3" opacity=".8" transform="rotate(-18 1105 88)"/></g>
  </g>

  <!-- neon squiggles -->
  <path class="squig" d="M70 70 q20 -20 40 0 t40 0 t40 0" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path class="squig" d="M1010 272 q18 -18 36 0 t36 0 t36 0" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- floating AI chip -->
  <g class="floatA" style="animation-delay:-2s">
    <rect x="285" y="112" width="44" height="44" rx="9" fill="none" stroke="#f472b6" stroke-width="3" filter="url(#glow)"/>
    <text x="307" y="141" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#f9a8d4">AI</text>
    <path d="M296 112v-8M318 112v-8M296 164v-8M318 164v-8" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- floating play/video icon -->
  <g class="floatB" style="animation-delay:-3s">
    <rect x="930" y="160" width="54" height="40" rx="10" fill="none" stroke="#67e8f9" stroke-width="3" filter="url(#glow)"/>
    <path d="M951 170l15 10-15 10z" fill="#67e8f9"/>
  </g>

  <!-- title -->
  <g class="flicker" filter="url(#glow)">
    <text x="600" y="118" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="78" font-weight="900" letter-spacing="4" fill="url(#title)">RAKSHITH</text>
  </g>
  <text class="sub" x="600" y="160" text-anchor="middle" font-family="Brush Script MT,Segoe Script,cursive" font-size="32" fill="#f0abfc" filter="url(#glow)">AI with Rakshith</text>
  <text x="600" y="205" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="3" fill="#e9d5ff">FOUNDER · MYDESIGNNEXUS  |  AI AUTOMATION  |  UI / UX  |  APPS</text>
</svg>
