rl(#chrome)">91</text><text x="958" y="138" class="m" font-weight="600" font-size="13">AI tools in my stack</text></g><g class="fade" style="animation-delay:0.3s"><rect x="706" y="170" width="222" height="118" rx="22" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".08"/><text x="726" y="240" class="d" font-size="60" fill="url(#chrome)">3</text><text x="726" y="268" class="m" font-weight="600" font-size="13">Content channels</text></g><g class="fade" style="animation-delay:0.44999999999999996s"><rect x="938" y="170" width="222" height="118" rx="22" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".08"/><text x="958" y="240" class="d" font-size="60" fill="url(#chrome)">6</text><text x="958" y="268" class="m" font-weight="600" font-size="13">Step build process</text></g></svg>